name: Bug report
description: Something broke or produced a wrong result in DesignDNA.
labels: [bug, beta]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DesignDNA! A URL, the node and a screenshot make most bugs reproducible.
        Please do not paste API keys, OAuth tokens or private customer data.
  - type: dropdown
    id: node
    attributes:
      label: Node or area
      options:
        - Source Import
        - UI Kit / Design System
        - Generator
        - Quality Pass
        - Page
        - Video / Editor / Render
        - DNA Editor
        - Project saving / loading
        - Agents / connections
        - Other
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site URL (if any)
      placeholder: https://example.com/
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - GPT-5.6 Sol (Codex)
        - GPT-6 Astra (Codex)
        - Claude Opus (Claude Code)
        - Not an AI step
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps, in order.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
      description: Attach screenshots or a short screen recording.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and app version
      placeholder: Windows 11, desktop 0.5.4, commit abc1234
  - type: textarea
    id: trace
    attributes:
      label: Model-call trace (optional)
      description: The last lines of `%APPDATA%\@designdna\desktop\data\traces\llm-calls.electron.jsonl`. It holds metadata only.
      render: json

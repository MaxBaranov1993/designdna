name: Desktop release artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "desktop/**"
      - "frontend/**"
      - "schema/**"
      - "spike/**"
      - "requirements*.txt"
      - ".github/workflows/desktop-release.yml"
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  make:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
            tools/repo-canvas/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm --prefix frontend ci
      - run: npm --prefix tools/repo-canvas ci
      - run: npm --prefix desktop ci
      - name: Install Linux package makers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-desktop-build.txt
      - run: npm --prefix frontend run build:desktop
      - run: npm --prefix desktop run runtime:build
      - run: npm --prefix desktop run runtime:smoke
      - run: npm --prefix desktop run make
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_FILE: ${{ secrets.WINDOWS_CERTIFICATE_FILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: npm --prefix desktop run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: designdna-${{ runner.os }}-${{ runner.arch }}
          path: desktop/out/make/**
          if-no-files-found: error

name: Desktop runtime

on:
  push:
    paths:
      - "desktop/**"
      - "app/desktop_worker.py"
      - "frontend/**"
      - "tools/repo-canvas/**"
      - "package.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "app/desktop_worker.py"
      - "frontend/**"
      - "tools/repo-canvas/**"
      - "package.json"
      - ".github/workflows/desktop.yml"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tools/repo-canvas/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm --prefix frontend ci
      - run: npm --prefix tools/repo-canvas ci
      - run: npm --prefix frontend run build:desktop
      - run: npm --prefix desktop test
      - run: python -m py_compile app/desktop_worker.py

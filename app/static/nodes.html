<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA of Web Design — нодовый редактор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e13; --panel: #16161d; --panel-2: #1c1c25; --border: #2a2a36; --border-soft: #23232e;
    --text: #ececf1; --muted: #8b8b9e; --accent: #5B5BD6; --accent-h: #6d6de8;
    --ok: #34c37b; --err: #e5534b; --wire-text: #7a7a8c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; overflow:hidden; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#2e2e3c; border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }

  .topbar { position:fixed; top:0; left:0; right:0; z-index:60; display:flex; align-items:center; gap:14px;
    padding:10px 18px; background:rgba(14,14,14,19,.88); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-soft); }
  .topbar .logo { font-weight:800; font-size:15px; letter-spacing:-.02em; }
  .topbar .logo span { color:var(--accent); }
  .topbar .hint { color:var(--muted); font-size:12px; }
  .topbar .spacer { flex:1; }
  .zoom-label { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; width:44px; text-align:center; }

  .btn { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font:600 12.5px 'Inter',sans-serif; cursor:pointer; transition:.15s; }
  .btn:hover { border-color:var(--accent); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:var(--accent-h); }
  .btn.small { padding:5px 10px; font-size:12px; }
  .btn.danger:hover { border-color:var(--err); color:var(--err); }

  /* холст */
  #viewport { position:fixed; inset:0; top:47px; overflow:hidden; cursor:default;
    background-image:radial-gradient(circle, #23232e 1px, transparent 1px); background-size:24px 24px; }
  #viewport.panning { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; transform-origin:0 0; }
  #wires { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }
  #wires path { fill:none; stroke-width:2; }
  #wires path.w-text { stroke:var(--wire-text); }
  #wires path.w-ir { stroke:var(--accent); }
  #wires path.w-temp { stroke:#9d9de8; stroke-dasharray:5 4; }

  /* ноды */
  .node { position:absolute; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35); user-select:none; }
  .node.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 10px 30px rgba(0,0,0,.45); }
  .node-head { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border-soft);
    cursor:grab; border-radius:12px 12px 0 0; background:linear-gradient(180deg, rgba(255,255,255,.025), transparent); }
  .node-head:active { cursor:grabbing; }
  .n-icon { width:20px; height:20px; border-radius:6px; background:var(--accent); color:#fff; font-size:11px;
    display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .n-title { font-weight:700; font-size:12.5px; flex:1; white-space:nowrap; }
  .n-x { border:none; background:none; color:var(--muted); cursor:pointer; font-size:12px; padding:2px 4px; border-radius:5px; }
  .n-x:hover { color:var(--err); background:rgba(229,83,75,.12); }
  .node-body { padding:10px 12px; display:flex; flex-direction:column; gap:9px; }
  .n-status { font-size:11px; color:var(--muted); min-height:14px; }
  .n-status.err { color:var(--err); }
  .n-status.ok { color:var(--ok); }

  /* порты */
  .port-row { display:flex; align-items:center; gap:7px; position:relative; font-size:11.5px; color:var(--muted); padding:2px 0; }
  .port-row.out { justify-content:flex-end; text-align:right; }
  .port { width:11px; height:11px; border-radius:50%; background:var(--panel-2); border:2px solid var(--wire-text);
    position:absolute; top:50%; transform:translateY(-50%); cursor:crosshair; transition:.12s; }
  .port:hover { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px rgba(91,91,214,.22); }
  .port-row.in .port { left:-18px; }
  .port-row.out .port { right:-18px; }
  .port-row[data-kind="ir"] .port { border-color:var(--accent); }
  .port-row.connected .port { background:var(--accent); border-color:var(--accent); }

  /* контролы внутри нод */
  .node textarea, .node select, .node input[type=text] { width:100%; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:7px 9px; font:500 12px 'Inter',sans-serif; outline:none; resize:vertical; }
  .node textarea:focus, .node select:focus { border-color:var(--accent); }
  .node textarea { min-height:56px; }
  .ctl-row { display:flex; gap:7px; align-items:center; }
  .ctl-row select { width:auto; flex:1; }
  .field-cap { font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; }

  /* генератор: миниатюры вариантов */
  .thumbs { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .thumb { position:relative; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; cursor:pointer;
    background:#fff; height:96px; transition:.12s; }
  .thumb:hover { border-color:var(--muted); }
  .thumb.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .thumb .tprev { pointer-events:none; position:absolute; top:0; left:0; width:100%; }
  .tbadge { position:absolute; top:4px; left:4px; z-index:2; background:rgba(14,14,19,.8); color:#fff;
    font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; }

  /* редактор: превью с Figma-инструментами + инспектор как в pen.dev */
  .edit-wrap { display:flex; gap:10px; align-items:stretch; }
  .edit-left { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .edit-preview { position:relative; background:#fff; border-radius:8px; overflow:auto; min-height:320px; max-height:430px; }
  .edit-inner { position:absolute; top:0; left:0; transform-origin:0 0; }
  .edit-preview .placeholder { padding:50px 16px; text-align:center; color:#999; font-size:12px; background:#f4f4f7; }
  .edit-inspector { width:252px; flex:none; background:var(--panel-2); border:1px solid var(--border);
    border-radius:8px; padding:10px; overflow-y:auto; max-height:430px; min-height:320px; }
  .geo-tools { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
  .geo-tools .sel-label { color:var(--accent); font-weight:700; }

  /* микс: входы с весами */
  .mix-row { display:flex; align-items:center; gap:8px; }
  .mix-row .cap { width:14px; font-size:11px; color:var(--muted); font-weight:700; }
  .mix-row input[type=range] { flex:1; accent-color:var(--accent); }
  .mix-row .wv { width:34px; text-align:right; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .mix-row .mx { border:none; background:none; color:var(--muted); cursor:pointer; font-size:11px; }
  .mix-row .mx:hover { color:var(--err); }

  /* референс */
  .ref-img { width:100%; border-radius:8px; border:1px solid var(--border); display:none; }
  .ref-drop { border:1.5px dashed var(--border); border-radius:8px; padding:14px; text-align:center; font-size:11.5px;
    color:var(--muted); cursor:pointer; transition:.15s; }
  .ref-drop:hover { border-color:var(--accent); color:var(--text); }

  /* контекстное меню */
  #ctx-menu { position:fixed; z-index:100; min-width:190px; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:6px; box-shadow:0 16px 50px rgba(0,0,0,.55); display:none; }
  #ctx-menu .ctx-cap { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase;
    letter-spacing:.07em; padding:5px 9px 3px; }
  #ctx-menu .ctx-item { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px; cursor:pointer; font-size:12.5px; font-weight:500; }
  #ctx-menu .ctx-item:hover { background:var(--panel-2); }
  #ctx-menu .ctx-item .ci { width:18px; height:18px; border-radius:5px; background:var(--accent); color:#fff; font-size:10px;
    display:inline-flex; align-items:center; justify-content:center; flex:none; }
  #ctx-menu .ctx-item small { color:var(--muted); font-size:10.5px; margin-left:auto; }

  /* toast */
  #toasts { position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:9px; }
  .toast { background:var(--panel-2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:9px;
    padding:10px 14px; font-size:12.5px; max-width:340px; box-shadow:0 8px 30px rgba(0,0,0,.45); animation:slidein .18s; }
  .toast.error { border-left-color:var(--err); }
  .toast.ok { border-left-color:var(--ok); }
  @keyframes slidein { from { transform:translateX(26px); opacity:0; } }

  .empty-note { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); color:var(--muted); font-size:12.5px;
    background:rgba(22,22,29,.85); border:1px solid var(--border-soft); padding:8px 16px; border-radius:9px; pointer-events:none; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">DNA<span>·</span>Web</div>
  <div class="hint">ПКМ — создать ноду · колесо — зум · drag фона — панорама · в ноде «Редактор» работают инструменты трансформации</div>
  <div class="spacer"></div>
  <span class="zoom-label" id="zoom-label">100%</span>
  <button class="btn small" id="btn-fit" title="Показать все ноды">⤢ Всё</button>
  <button class="btn small" id="btn-export">Экспорт JSON</button>
  <button class="btn small" id="btn-import">Импорт</button>
  <button class="btn small danger" id="btn-clear">Очистить</button>
  <input type="file" id="import-file" accept="application/json" style="display:none">
</header>

<div id="viewport">
  <div id="world">
    <svg id="wires" width="1" height="1"></svg>
  </div>
</div>

<div id="ctx-menu"></div>
<div id="toasts"></div>
<div class="empty-note" id="empty-note">Правый клик по холсту — создать первую ноду (например, «Промпт» → «Генератор» → «Редактор»)</div>

<script src="/static/renderer.js"></script>
<script src="/static/geoedit.js"></script>
<script src="/static/inspector.js"></script>
<script src="/static/irhistory.js"></script>
<script src="/static/editor.js"></script>
<script src="/static/nodes.js"></script>
</body>
</html>

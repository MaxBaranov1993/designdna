"compass", "title": "Стратегия и исследования", "text": "Аудит бренда, пользовательские исследования, позиционирование. Фундамент до первого макета."}]}, {"id": "process", "type": "steps", "variant": "numbered", "props": {"heading": "Как мы работаем"}, "children": [{"type": "card", "title": "01 — Погружение", "text": "Изучаем бизнес, аудиторию и конкурентов. Проводим интервью и аудит. Формулируем задачу совместно с клиентом."}, {"type": "card", "title": "02 — Концепция", "text": "Генерируем идеи, отбираем 2–3 направления. Презентуем с обоснованием. Фиксируем вектор до детализации."}, {"type": "card", "title": "03 — Реализация", "text": "Проектируем, дизайним, прорабатываем каждый элемент. Показываем промежуточные результаты еженедельно."}, {"type": "card", "title": "04 — Запуск", "text": "Готовим файлы, гайдлайны, спецификации. Сопровождаем внедрение. Остаёмся на связи после сдачи проекта."}]}, {"id": "team", "type": "team", "variant": "grid-4", "props": {"heading": "Команда"}, "children": [{"type": "card", "children": [{"type": "avatar", "name": "Алексей Громов", "role": "Основатель, креативный директор"}, {"type": "text", "text": "15 лет в дизайне. Ex-Shuka, ex-HSE Art and Design School."}]}, {"type": "card", "children": [{"type": "avatar", "name": "Марина Векилова", "role": "Арт-директор"}, {"type": "text", "text": "Специализация — брендинг и типографика. Преподаёт в БВШД."}]}, {"type": "card", "children": [{"type": "avatar", "name": "Дмитрий Касаткин", "role": "Ведущий продуктовый дизайнер"}, {"type": "text", "text": "UX/UI, дизайн-системы. Пришёл из Яндекса, 8 лет в продукте."}]}, {"type": "card", "children": [{"type": "avatar", "name": "Анна Стогова", "role": "Дизайнер среды и моушена"}, {"type": "text", "text": "Environmental design, After Effects, Cinema 4D. Делает пространство живым."}]}]}, {"id": "testimonials", "type": "testimonials", "variant": "grid-2", "props": {}, "children": [{"type": "card", "children": [{"type": "rating", "value": 5}, {"type": "tex

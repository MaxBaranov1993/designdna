<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }
    .market-header { width: 100%; height: 76px; display: flex; align-items: center; gap: 18px; padding: 12px 28px; background: #fff; color: #171717; }
    .brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .catalog { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 18px; border: 1px solid #aaa; background: #fff; }
    .search { min-width: 280px; flex: 1; height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 14px; border: 1px solid #aaa; border-radius: 10px; overflow: hidden; }
    .search input { min-width: 0; flex: 1; height: 40px; border: 0; font-size: 14px; white-space: nowrap; }
    .search select { width: 112px; height: 40px; border: 0; border-left: 1px solid #ddd; background: #fff; }
    .search button { height: 40px; padding: 0 22px; border: 0; border-radius: 10px; background: #ff6b20; color: #fff; font-weight: 700; }
    .links { display: flex; align-items: center; gap: 20px; white-space: nowrap; }
    .links a { display: flex; align-items: center; gap: 6px; color: #171717; text-decoration: none; }
    .favorite { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #171717; }
    .login { height: 40px; display: flex; align-items: center; gap: 6px; color: #171717; text-decoration: none; }
    .publish { height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #7715ed; color: #fff; font-weight: 700; white-space: nowrap; }
    .mobile-menu { display: none; height: 44px; padding: 0 14px; border: 1px solid #aaa; background: #fff; }
    @media (max-width: 800px) {
      .market-header { height: auto; min-height: 72px; flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
      .catalog, .links { display: none; }
      .mobile-menu { display: block; }
      .search { order: 3; flex-basis: 100%; }
      .publish { margin-left: auto; }
    }
    @media (max-width: 480px) {
      .market-header { padding: 8px 10px; }
      .publish { width: 44px; padding: 0; overflow: hidden; white-space: nowrap; }
      .search select { width: 86px; }
      .search button { padding: 0 14px; }
    }
  </style>
</head>
<body>
  <header id="fixture-header" class="market-header">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-label="Logo"><circle cx="14" cy="14" r="11" fill="#ff6b20"/></svg>
      <strong>Market</strong>
    </div>
    <button class="catalog"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="1" y="1" width="6" height="6" fill="currentColor"/><rect x="11" y="1" width="6" height="6" fill="currentColor"/><rect x="1" y="11" width="6" height="6" fill="currentColor"/><rect x="11" y="11" width="6" height="6" fill="currentColor"/></svg><span>Catalog</span></button>
    <form class="search">
      <input aria-label="Search" placeholder="What are you looking for? For example: iPhone 12 or sofa">
      <select aria-label="City"><option>Belgrade</option><option>Novi Sad</option></select>
      <button class="find" type="submit"><span>Find</span></button>
    </form>
    <nav class="links"><a href="#map"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 15s5-5.2 5-9A5 5 0 0 0 3 6c0 3.8 5 9 5 9Z" fill="#7715ed"/><circle cx="8" cy="6" r="2" fill="#fff"/></svg><span>Map</span></a><a href="#journal">Journal</a><a href="#lang">EN</a></nav>
    <a class="favorite" href="#favorite" aria-label="Favorite"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 17 3.5 10.8A4.7 4.7 0 0 1 10 4a4.7 4.7 0 0 1 6.5 6.8Z" fill="currentColor"/></svg></a>
    <a class="login" href="#login"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 16c0-3 2.3-5 6-5s6 2 6 5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Login</span></a>
    <button class="mobile-menu" aria-label="Menu"><span>Menu</span></button>
    <button class="publish"><span>Publish listing</span></button>
  </header>
</body>
</html>

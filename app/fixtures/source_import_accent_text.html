<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accent text channels</title>
<style>
  body { margin: 0; background: #08090d; font-family: Arial, Helvetica, sans-serif; }
  #accent-hero { padding: 40px; }
  h1 { margin: 0; color: #f4f2ee; font-size: 48px; font-weight: 800; line-height: 1.1; }
  /* Акцентное слово: собственный цвет + свечение. Раньше сливалось с
     заголовком и приезжало обычным белым текстом. */
  .glow { color: #a78bfa; text-shadow: 0 0 24px rgba(167, 139, 250, 0.65); }
  /* Градиентная заливка глифов: color прозрачный, краска — из градиента. */
  .gradient {
    background-image: linear-gradient(90deg, #7c6cf0 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin: 18px 0 0; color: #9aa2b4; font-size: 18px; }
</style>
</head>
<body>
  <section id="accent-hero">
    <h1>Outreach autopilot that <span class="glow">finds your buyers</span> today</h1>
    <h1><span class="gradient">Gradient headline</span> stays readable</h1>
    <p>Plain supporting copy with no accent treatment.</p>
  </section>
</body>
</html>

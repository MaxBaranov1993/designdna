<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #08060f; color: #ece7fa; font-family: Arial, sans-serif; }
    #phase4 { width: 700px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .row { height: 28px; display: flex; align-items: center; }
    .spacer { flex: 1; height: 1px; }
    .status { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(52, 211, 153, .72); }
    .panel { position: relative; height: 90px; padding: 12px; overflow: hidden;
      background-color: rgba(255, 255, 255, .10);
      background-image: linear-gradient(115deg, rgba(60, 34, 10, .70), rgba(28, 18, 46, .62)); }
    .panel::before { content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(90deg, transparent, rgba(255,255,255,.13), transparent); }
    .wrapper { position: relative; }
    .pill { display: inline-flex; padding: 3px 8px; border: 1px solid rgba(241,193,82,.55);
      background: rgba(20,13,38,.66); color: #f1c152; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <section id="phase4">
    <div class="row"><strong>Left</strong><span class="spacer"></span><span class="status"><span class="dot"></span>online</span></div>
    <div class="panel"><span class="wrapper"><span class="pill">styled child</span></span></div>
  </section>
</body>
</html>
